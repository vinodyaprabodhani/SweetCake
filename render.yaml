services:
  # Backend API
  - type: web
    name: sweetcake-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sweetcake-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  # Frontend Static Site
  - type: static
    name: sweetcake-frontend
    runtime: static
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sweetcake-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: sweetcake-db
    plan: free
    databaseName: sweetcake_db
    user: root
